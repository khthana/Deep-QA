server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles never change under one name; index.html must not be
    # cached, or a rebuilt image keeps serving the old bundle's names.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (react-router): any path that is not a file is the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
